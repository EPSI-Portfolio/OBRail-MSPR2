name: Model CI/CD

on:
  push:
    paths:
      - 'src/train_advanced.py'
      - 'src/optimize.py'
      - 'src/evaluate.py'
      - 'data/processed/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain-validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - run: pip install -r requirements.txt

      - name: Validate processed data
        run: |
          python -c "
          import pandas as pd
          for f in ['data/processed/X_train.csv','data/processed/X_test.csv','data/processed/y_train.csv','data/processed/y_test.csv']:
              df = pd.read_csv(f)
              assert not df.empty, f'{f} is empty'
              assert df.isnull().sum().sum() == 0, f'{f} contains nulls'
          print('Data validation passed')
          "

      - name: Train candidates + optimize
        run: |
          python src/train_advanced.py
          python src/optimize.py

      - name: Evaluate (gate on metrics)
        run: python src/evaluate.py --min-f1 0.55 --min-auc 0.85

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: best_model_optimized
          path: |
            models/best_model_optimized.joblib
            data/processed/scaler.joblib

  deploy:
    needs: retrain-validate-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: best_model_optimized
          path: models_tmp/

      - name: Commit updated model to registry
        run: |
          mkdir -p models data/processed
          cp models_tmp/models/best_model_optimized.joblib models/
          cp models_tmp/data/processed/scaler.joblib data/processed/
          git config user.name "model-ci-bot"
          git config user.email "ci@obrail.local"
          git add -f models/best_model_optimized.joblib data/processed/scaler.joblib
          git commit -m "chore: update model [ci]" || echo "no changes"
          git push
